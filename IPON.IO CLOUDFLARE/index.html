<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; height: 100%; }
  html, body { margin: 0; background:#F4F3EE; height: 100%; overscroll-behavior-y: contain; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; padding: 0; font-size: inherit; touch-action: manipulation; }
  input, select { font-family: inherit; font-size: inherit; touch-action: manipulation; }
  input.sm-input, select.sm-input { font-size: 16px; } /* prevents iOS Safari auto-zoom on focus */
  svg { display: block; flex-shrink: 0; }
  p, h1 { margin: 0; }

  .sm-app { font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background:#F4F3EE; color:#1E2419; font-synthesis:none; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility; }
  .sm-display, h1,h2,h3,h4,.account-name,.account-plan-name,.account-plan-price,.settings-title,.settings-section-title { font-family:'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-synthesis:none; }
  .sm-card { background:#FFFFFF; border:1px solid #E1DED2; border-radius:14px; }
  .sm-card-accent { border-left:3px solid #2F5D4E; }
  .sm-btn-primary { background:#2F5D4E; color:#fff; transition:background .15s ease; min-height:44px; display:inline-flex; align-items:center; justify-content:center; }
  .sm-btn-primary:hover:not(:disabled) { background:#1F4237; }
  .sm-btn-primary:disabled { background:#B7C2BC; cursor:not-allowed; }
  .sm-btn-save { background:#FBF3E4; color:#9C6C1F; border:1px solid #EEDCB6; transition:background .15s ease; min-height:38px; display:inline-flex; align-items:center; justify-content:center; }
  .sm-btn-save:hover { background:#F7EAD1; }
  .sm-btn-ghost { background:transparent; color:#6B7060; border:1px solid #E1DED2; transition:background .15s ease; min-height:38px; display:inline-flex; align-items:center; justify-content:center; }
  .sm-btn-ghost:hover { background:#EDEBE2; }
  .sm-input { background:#FBFAF6; border:1px solid #E1DED2; color:#1E2419; min-height:44px; }
  .sm-input:focus { outline:none; border-color:#2F5D4E; box-shadow:0 0 0 3px rgba(47,93,78,0.12); }
  .sm-tab { color:#6B7060; border-bottom:2px solid transparent; white-space:nowrap; background:none; flex:1 1 0%; justify-content:center; min-height:48px; }
  .sm-tab.active { color:#1E2419; border-bottom:2px solid #2F5D4E; font-weight:600; }
  .sm-progress-track { background:#EDEBE2; border-radius:999px; overflow:hidden; height:8px; }
  .sm-progress-fill { height:100%; border-radius:999px; transition:width .5s ease; }
  .sm-progress-fill.ok { background:#2F5D4E; }
  .sm-progress-fill.warn { background:#C98A2C; }
  .sm-chip { border:1px solid #E1DED2; color:#6B7060; background:#fff; transition:all .15s ease; min-height:32px; display:inline-flex; align-items:center; justify-content:center; }
  .sm-chip.active { background:#1E2419; color:#F4F3EE; border-color:#1E2419; }
  .sm-row + .sm-row { border-top:1px solid #EDEBE2; }
  .sm-tag { font-size:11px; padding:2px 8px; border-radius:999px; white-space:nowrap; }
  .sm-lock-banner { font-size:12px; border-radius:8px; padding:6px 8px; }
  .sm-toggle-row { min-height:44px; }

  .sm-price-pill { display:inline-flex; align-items:center; gap:6px; border:1px solid #CFE1D8; background:#E9F2EE; color:#2F5D4E; border-radius:999px; padding:5px 9px; font-size:11px; font-weight:600; }
  input[type="checkbox"] { width:20px; height:20px; accent-color:#2F5D4E; flex-shrink:0; }
  .sm-safe-top { padding-top: max(1.25rem, env(safe-area-inset-top)); }
  .sm-safe-x { padding-left: max(1rem, env(safe-area-inset-left)); padding-right: max(1rem, env(safe-area-inset-right)); }
  .sm-safe-bottom { padding-bottom: max(2rem, env(safe-area-inset-bottom)); }

  .flex{display:flex}
  .grid{display:grid}
  .grid-cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .items-center{align-items:center}
  .justify-between{justify-content:space-between}
  .justify-center{justify-content:center}
  .flex-wrap{flex-wrap:wrap}
  .flex-1{flex:1 1 0%}
  .shrink-0{flex-shrink:0}
  .min-w-0{min-width:0}
  .w-full{width:100%}
  .max-w-md{max-width:28rem}
  .min-h-screen{min-height:100vh}
  @supports (height: 100dvh) { .min-h-screen{min-height:100dvh} }

  /* Wider viewports (tablets, desktop browsers): loosen the phone-width column a bit
     and let the four "My Ipon" stat cards sit in one row instead of a cramped 2x2. */
  @media (min-width: 640px) {
    .max-w-md{max-width:36rem}
    .sm-grid-stats{grid-template-columns:repeat(4,minmax(0,1fr))}
  }
  @media (min-width: 1024px) {
    body{background:#EAE8DD}
  }
  .gap-1\.5{gap:.375rem}
  .gap-2{gap:.5rem}
  .p-3{padding:.75rem}
  .p-4{padding:1rem}
  .py-1{padding-top:.25rem;padding-bottom:.25rem}

  .px-2{padding-left:.5rem;padding-right:.5rem}
  .px-3{padding-left:.75rem;padding-right:.75rem}
  .pt-5{padding-top:1.25rem}
  .pb-3{padding-bottom:.75rem}
  .pb-8{padding-bottom:2rem}
  .mt-0\.5{margin-top:.125rem}

  .font-semibold{font-weight:600}
  .font-bold{font-weight:700}

  /* ===== ipon.io visual refresh v2 ===== */
  :root{
    --ipon-bg:#F6F7F2;
    --ipon-surface:#FFFFFF;
    --ipon-ink:#17231D;
    --ipon-muted:#68736B;
    --ipon-green:#1F6B52;
    --ipon-green-dark:#174E3C;
    --ipon-green-soft:#E8F4EE;
    --ipon-border:#E4E8E1;
    --ipon-shadow:0 10px 30px rgba(23,35,29,.07);
  }
  html,body{background:var(--ipon-bg);}
  .sm-app{background:var(--ipon-bg);color:var(--ipon-ink);min-height:100vh;}
  .sm-card{
    background:var(--ipon-surface);
    border:1px solid var(--ipon-border);
    border-radius:18px;
    box-shadow:0 2px 10px rgba(23,35,29,.025);
    transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
  }
  .sm-card:hover{box-shadow:var(--ipon-shadow);}
  .sm-card-accent{border-left:4px solid var(--ipon-green);}
  .sm-display{letter-spacing:-.025em;}
  .sm-btn-primary{
    background:var(--ipon-green);
    border-radius:12px;
    min-height:46px;
    box-shadow:0 5px 14px rgba(31,107,82,.18);
    transition:transform .15s ease,background .15s ease,box-shadow .15s ease;
  }
  .sm-btn-primary:hover:not(:disabled){background:var(--ipon-green-dark);transform:translateY(-1px);box-shadow:0 8px 18px rgba(31,107,82,.22);}
  .sm-btn-primary:active:not(:disabled){transform:translateY(0);}
  .sm-btn-save{
    border-radius:12px;
    background:#F3EBDD;
    border-color:#E9D6AE;
  }
  .sm-btn-ghost{border-radius:12px;background:#fff;border-color:var(--ipon-border);}
  .sm-btn-ghost:hover{background:#F4F7F3;}
  .sm-input{
    background:#FCFDFC;
    border-color:var(--ipon-border);
    border-radius:12px;
    min-height:46px;
  }
  .sm-input:focus{border-color:var(--ipon-green);box-shadow:0 0 0 4px rgba(31,107,82,.10);}
  .sm-tab{
    min-height:52px;
    color:#7A837D;
    border-bottom-width:2px;
    transition:color .15s ease,background .15s ease;
  }
  .sm-tab.active{color:var(--ipon-ink);border-bottom-color:var(--ipon-green);font-weight:700;}
  .sm-safe-x{padding-left:16px;padding-right:16px;}
  .sm-safe-top{padding-top:max(16px,env(safe-area-inset-top));}
  main.sm-safe-x{padding-bottom:28px;}
  .ipon-hero{
    position:relative;
    overflow:hidden;
    border-radius:24px;
    padding:22px;
    color:#fff;
    background:linear-gradient(145deg,#1F6B52 0%,#174E3C 100%);
    box-shadow:0 14px 34px rgba(23,78,60,.20);
  }
  .ipon-hero:after{
    content:"";
    position:absolute;
    width:180px;height:180px;
    right:-65px;top:-75px;
    border-radius:50%;
    background:rgba(255,255,255,.07);
    pointer-events:none;
  }
  .ipon-hero .hero-label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.78;}
  .ipon-hero .hero-amount{font-family:'Manrope',sans-serif;font-size:34px;line-height:1.05;font-weight:800;letter-spacing:-.04em;margin-top:7px;}
  .ipon-hero .hero-sub{font-size:12px;opacity:.75;margin-top:7px;}
  .ipon-hero .hero-goal{
    margin-top:18px;padding-top:15px;
    border-top:1px solid rgba(255,255,255,.16);
  }
  .ipon-hero .hero-progress{height:7px;border-radius:99px;background:rgba(255,255,255,.17);overflow:hidden;margin-top:9px;}
  .ipon-hero .hero-progress > span{display:block;height:100%;border-radius:99px;background:#fff;}
  .ipon-kpi{
    background:#fff;border:1px solid var(--ipon-border);border-radius:16px;padding:14px;
  }
  .ipon-kpi-value{font-family:'Manrope',sans-serif;font-size:20px;font-weight:800;letter-spacing:-.025em;}
  .ipon-kpi-label{font-size:11px;color:var(--ipon-muted);margin-top:3px;}
  @media (min-width:600px){
    .sm-safe-x{padding-left:20px;padding-right:20px;}
  }
  @media (max-width:480px){
    .sm-tab{font-size:12px!important;gap:4px!important;}
    .ipon-hero{padding:20px;border-radius:22px;}
    .ipon-hero .hero-amount{font-size:31px;}
    main.sm-safe-x{padding-top:14px!important;}
  }



/* ===== Step 4: Account redesign ===== */
.account-page{display:grid;gap:12px}
.account-hero{position:relative;overflow:hidden;padding:18px;border-radius:20px;background:linear-gradient(145deg,#1F6B52 0%,#174E3C 100%);color:#fff;box-shadow:0 12px 28px rgba(23,78,60,.16)}
.account-hero:after{content:"";position:absolute;width:150px;height:150px;right:-58px;top:-66px;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.account-profile{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.account-avatar{width:50px;height:50px;border-radius:16px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.12)}
.account-name{font-family:'Manrope',sans-serif;font-size:17px;font-weight:800;letter-spacing:-.02em}
.account-email{font-size:11px;opacity:.76;margin-top:3px}
.account-status-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px;padding-top:13px;border-top:1px solid rgba(255,255,255,.15)}
.account-status-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;opacity:.68;font-weight:700}
.account-status-value{font-size:12px;font-weight:800;margin-top:3px}
.account-status-pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:6px 9px;background:rgba(255,255,255,.13);font-size:10px;font-weight:800}
.account-section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.account-section-head h3{font-family:'Manrope',sans-serif;font-size:15px;margin:0;font-weight:800;letter-spacing:-.02em}
.account-section-head p{font-size:10px;color:var(--ipon-muted);margin:3px 0 0;line-height:1.45}
.account-plan{padding:15px;border-radius:17px;border:1px solid #D9E6DF;background:#F7FBF9}
.account-plan.free{background:#fff;border-color:var(--ipon-border)}
.account-plan-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.account-plan-name{font-family:'Manrope',sans-serif;font-size:17px;font-weight:800}
.account-plan-price{font-family:'Manrope',sans-serif;font-size:24px;font-weight:800;letter-spacing:-.04em;margin-top:5px}
.account-plan-price small{font-family:'Inter',sans-serif;font-size:10px;font-weight:600;color:var(--ipon-muted);letter-spacing:0}
.account-plan-badge{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:5px 8px;border-radius:999px;background:#E8F4EE;color:#1F6B52}
.account-feature-list{display:grid;gap:7px;margin-top:12px}
.account-feature{display:flex;align-items:flex-start;gap:7px;font-size:10px;color:#4F5B53;line-height:1.35}
.account-compare{display:grid;grid-template-columns:1fr 58px 70px;gap:0;margin-top:12px;border:1px solid var(--ipon-border);border-radius:13px;overflow:hidden}
.account-compare>div{padding:8px 9px;font-size:9px;border-top:1px solid var(--ipon-border)}
.account-compare>div:nth-child(-n+3){border-top:0;background:#FBFAF6;font-weight:800}
.account-compare .compare-head{text-align:center}
.account-compare .yes{color:#1F6B52;font-weight:800;text-align:center}
.account-compare .premium{color:#9C6C1F;font-weight:800;text-align:center}
.account-wallet-list{display:grid;gap:8px;margin-top:11px}
.account-wallet{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border:1px solid var(--ipon-border);border-radius:14px;background:#fff}
.account-wallet-main{display:flex;align-items:center;gap:9px;min-width:0}
.account-wallet-logo{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800}
.account-wallet-name{font-size:12px;font-weight:800}
.account-wallet-note{font-size:9px;color:var(--ipon-muted);margin-top:2px}
.account-connected{font-size:9px;color:#1F6B52;font-weight:800;display:flex;align-items:center;gap:4px}
.account-safety{padding:13px;border-radius:15px;background:#FBF6EA;border:1px solid #EEDCB6}
.account-safety-row{display:flex;align-items:flex-start;gap:9px}
.account-safety-icon{width:32px;height:32px;flex:0 0 auto;border-radius:10px;background:#F4E6C9;display:flex;align-items:center;justify-content:center;color:#8E641F}
.account-safety h3{margin:0;font-size:12px;font-weight:800;color:#4A3A1D}
.account-safety p{margin:4px 0 0;font-size:10px;line-height:1.5;color:#6B7060}
.account-safety-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:10px}
.account-safety-item{padding:9px;border-radius:10px;background:#fff;border:1px solid #EEDCB6}
.account-safety-item strong{display:block;font-size:10px;color:#4A3A1D}
.account-safety-item span{display:block;font-size:9px;color:#7A837D;margin-top:2px;line-height:1.35}
.account-demo{display:flex;align-items:flex-start;gap:7px;padding:8px 9px;border-radius:10px;background:#FBF3E4;border:1px solid #EEDCB6;color:#8B641F;font-size:9px;line-height:1.4}
.account-action-row{display:flex;gap:8px;margin-top:12px}
.account-action-row button{flex:1}
@media(max-width:420px){.account-compare{grid-template-columns:1fr 52px 62px}.account-compare>div{padding:8px 6px}}

/* ===== Savings Goals redesign ===== */
.goals-header{display:flex;flex-direction:column;gap:12px}
.goals-heading-row{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;padding:4px 2px}
.goals-heading-row h2{font-family:'Manrope',sans-serif;font-size:28px;line-height:1.08;letter-spacing:-.04em;margin:4px 0 5px}
.goals-heading-row p:not(.eyebrow){font-size:12px;color:var(--ipon-muted);max-width:520px;line-height:1.5}
.eyebrow{font-size:10px!important;text-transform:uppercase;letter-spacing:.11em;color:var(--ipon-green)!important;font-weight:800}
.goals-target-icon{width:48px;height:48px;border-radius:15px;background:var(--ipon-green-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.overall-goal{padding:18px}
.overall-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.overall-top>div:first-child{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap}
.overall-top strong{font-family:'Manrope',sans-serif;font-size:27px;letter-spacing:-.04em;display:block;width:100%;margin-top:3px}
.goal-label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ipon-muted);font-weight:700}
.overall-target{font-size:11px;color:var(--ipon-muted)}
.overall-percent{font-family:'Manrope',sans-serif;font-size:25px;font-weight:800;color:var(--ipon-green)}
.overall-progress{margin-top:13px}
.overall-progress .sm-progress-track{height:11px}
.overall-bottom{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:10px;color:var(--ipon-muted)}
.goal-summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.goal-mini{padding:12px 13px}
.goal-mini span{display:block;font-size:10px;color:var(--ipon-muted)}
.goal-mini strong{display:block;font-family:'Manrope',sans-serif;font-size:16px;margin-top:4px;letter-spacing:-.02em}
.goal-section-bar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.goal-section-bar h3,.section-heading h3{font-family:'Manrope',sans-serif;font-size:16px;margin:0;letter-spacing:-.02em}
.goal-section-bar p,.section-heading p{font-size:11px;color:var(--ipon-muted);margin:3px 0 0}
.create-goal-btn{display:flex;align-items:center;gap:8px;background:var(--ipon-green);color:#fff;border-radius:12px;padding:9px 12px;min-height:44px;box-shadow:0 5px 14px rgba(31,107,82,.16)}
.create-goal-btn span:last-child{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
.create-goal-btn small{font-size:9px;opacity:.72;margin-top:3px}
.create-goal-icon{width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,.13);display:flex;align-items:center;justify-content:center}
.goal-list{display:grid;gap:10px}
.goal-card{padding:16px;position:relative}
.goal-card.goal-active{border-color:#BFD9CC;box-shadow:0 5px 20px rgba(31,107,82,.08)}
.goal-card.goal-active:before{content:"";position:absolute;left:-1px;top:15px;bottom:15px;width:3px;border-radius:99px;background:var(--ipon-green)}
.goal-card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.goal-title-wrap{min-width:0}
.goal-name{font-family:'Manrope',sans-serif;font-size:16px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.goal-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.goal-status{font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:999px}
.goal-status.active{background:#E8F4EE;color:#1F6B52}
.goal-status.locked{background:#FBF3E4;color:#9C6C1F}
.goal-status.ready{background:#E5F5ED;color:#216A4E}
.goal-status.completed{background:#EEF0EC;color:#667068}
.goal-route{font-size:9px;color:#1F6B52;font-weight:700}
.goal-amounts{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-top:15px}
.goal-amounts>div{display:flex;flex-direction:column}
.goal-saved{font-family:'Manrope',sans-serif;font-size:27px;letter-spacing:-.045em;line-height:1.1;margin-top:3px}

/* ===== Step 7: Mobile / PWA polish ===== */
html{scroll-behavior:smooth;}
body{min-height:100%;}
button,a,input,select{touch-action:manipulation;}
.sm-app{min-height:100dvh;}
.sm-app > .max-w-md{width:100%;}
.sm-tab{position:relative;transition:color .18s ease,transform .12s ease,background .18s ease;}
.sm-tab:active{transform:scale(.96);}
.sm-tab:focus-visible,.sm-btn-primary:focus-visible,.sm-btn-save:focus-visible,.sm-btn-ghost:focus-visible{outline:3px solid rgba(31,107,82,.22);outline-offset:2px;}
.sm-tab.active:after{content:"";position:absolute;left:18%;right:18%;bottom:-1px;height:3px;border-radius:999px;background:var(--ipon-green,#1F6B52);}
main.sm-safe-x{padding-bottom:calc(6.5rem + env(safe-area-inset-bottom));}
main.sm-safe-x > *{animation:step7-fade .22s ease both;}
@keyframes step7-fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.sm-tab,.sm-card,.sm-btn-primary,.sm-btn-save,.sm-btn-ghost{transition:none!important}main.sm-safe-x > *{animation:none!important}}
.sm-loading{display:flex;align-items:center;justify-content:center;gap:8px;padding:24px;color:var(--ipon-muted,#68736B);font-size:13px;}
.sm-loading-dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:step7-pulse 1s infinite ease-in-out;}
.sm-loading-dot:nth-child(2){animation-delay:.12s}.sm-loading-dot:nth-child(3){animation-delay:.24s}
@keyframes step7-pulse{0%,70%,100%{opacity:.3;transform:scale(.8)}35%{opacity:1;transform:scale(1)}}
.sm-empty{padding:28px 18px;text-align:center;border:1px dashed var(--ipon-border,#E4E8E1);border-radius:16px;background:rgba(255,255,255,.62);}
.sm-empty-icon{width:44px;height:44px;border-radius:14px;margin:0 auto 10px;background:var(--ipon-green-soft,#E8F4EE);display:flex;align-items:center;justify-content:center;color:var(--ipon-green,#1F6B52);}
.sm-empty h3{font-family:'Manrope',sans-serif;font-size:15px;font-weight:800;margin:0 0 4px;}
.sm-empty p{font-size:12px;line-height:1.5;color:var(--ipon-muted,#68736B);margin:0;}
.sm-sticky-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,36rem);z-index:50;padding:8px max(10px,env(safe-area-inset-left)) calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--ipon-border,#E4E8E1);box-shadow:0 -8px 24px rgba(23,35,29,.07);}
.sm-sticky-nav .sm-tab{min-height:48px;border-bottom:0;border-radius:12px;flex-direction:column;gap:3px!important;font-size:10px!important;padding:5px 2px!important;}
.sm-sticky-nav .sm-tab.active{background:var(--ipon-green-soft,#E8F4EE);color:var(--ipon-green,#1F6B52);}
.sm-sticky-nav .sm-tab.active:after{display:none;}
@media (min-width:640px){main.sm-safe-x{padding-bottom:2rem}.sm-sticky-nav{position:static;transform:none;width:auto;padding:0;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;border-top:0;box-shadow:none}.sm-sticky-nav .sm-tab{flex-direction:row;font-size:inherit!important;border-bottom:2px solid transparent;border-radius:0;background:transparent;padding:.625rem 0!important;}.sm-sticky-nav .sm-tab.active{background:transparent;color:var(--ipon-ink,#17231D);border-bottom-color:var(--ipon-green,#1F6B52);}.sm-sticky-nav .sm-tab.active:after{display:none;}}
@media (max-width:420px){.sm-tab{font-size:11px!important}.sm-sticky-nav .sm-tab{font-size:9px!important}.sm-sticky-nav{padding-left:6px;padding-right:6px}.sm-sticky-nav .sm-tab{min-height:46px;}}


  /* ===== Step 8: Final design consistency audit ===== */
  :root{
    --ipon-radius-sm:10px;
    --ipon-radius-md:14px;
    --ipon-radius-lg:18px;
    --ipon-space:12px;
    --ipon-focus:rgba(31,107,82,.18);
  }
  body{color:var(--ipon-ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  button,input,select,textarea{font:inherit;}
  button{cursor:pointer;}
  button:disabled{cursor:not-allowed;}
  a{color:inherit;}
  .sm-app{width:100%;}
  .sm-app>div{min-height:100dvh;}
  .sm-safe-x{box-sizing:border-box;}
  main{padding-bottom:calc(92px + env(safe-area-inset-bottom));}

  /* Shared visual language across every screen */
  .sm-card,.settings-section,.settings-profile-card{box-sizing:border-box;}
  .sm-card h1,.sm-card h2,.sm-card h3,.settings-section h3{color:var(--ipon-ink);}
  .sm-btn-primary,.sm-btn-save,.sm-btn-ghost,.create-goal-btn,.settings-inline-btn,.settings-wide-link{transition:transform .16s ease,background-color .16s ease,border-color .16s ease,box-shadow .16s ease;}
  .sm-btn-primary:hover:not(:disabled),.sm-btn-save:hover:not(:disabled),.sm-btn-ghost:hover:not(:disabled),.settings-inline-btn:hover,.settings-wide-link:hover,.create-goal-btn:hover{transform:translateY(-1px);}
  .sm-btn-primary:active:not(:disabled),.sm-btn-save:active:not(:disabled),.sm-btn-ghost:active:not(:disabled),.settings-inline-btn:active,.settings-wide-link:active,.create-goal-btn:active{transform:translateY(0);}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ipon-focus);outline-offset:2px;}

  /* Settings — brought into the same hierarchy, spacing, radii and typography as the other screens */
  .settings-page{display:grid;gap:12px;padding-bottom:8px;}
  .settings-header{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:4px 2px 2px;}
  .settings-header h2{font-family:'Manrope',sans-serif;font-size:27px;line-height:1.08;letter-spacing:-.04em;margin:4px 0 5px;color:var(--ipon-ink);}
  .settings-header p:not(.eyebrow){font-size:11px;color:var(--ipon-muted);line-height:1.5;max-width:360px;}
  .settings-header-icon{width:44px;height:44px;border-radius:14px;background:var(--ipon-green-soft);border:1px solid #CFE1D8;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .settings-profile-card{display:flex;align-items:center;gap:11px;padding:13px;border-radius:18px;background:var(--ipon-surface);border:1px solid var(--ipon-border);box-shadow:0 2px 10px rgba(23,35,29,.025);}
  .settings-profile-icon{width:38px;height:38px;border-radius:12px;background:var(--ipon-green);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .settings-profile-label{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--ipon-muted);font-weight:800;}
  .settings-profile-card strong{display:block;font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .settings-profile-card span{display:block;font-size:9px;color:var(--ipon-muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .settings-inline-btn,.settings-wide-link{border:1px solid #CFE1D8;background:#F3F8F5;color:var(--ipon-green);font-weight:800;font-size:10px;border-radius:10px;padding:7px 10px;white-space:nowrap;min-height:34px;display:inline-flex;align-items:center;justify-content:center;}
  .settings-section{padding:14px;border-radius:18px;background:var(--ipon-surface);border:1px solid var(--ipon-border);box-shadow:0 2px 10px rgba(23,35,29,.025);}
  .settings-section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px;}
  .settings-section-head h3{font-family:'Manrope',sans-serif;font-size:14px;font-weight:800;letter-spacing:-.02em;margin:0;}
  .settings-section-head p{font-size:9px;color:var(--ipon-muted);line-height:1.45;margin:3px 0 0;}
  .settings-section-icon{width:30px;height:30px;border-radius:9px;background:var(--ipon-green-soft);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .settings-section-icon.warning{background:#F4E6C9;}
  .settings-count-badge{font-size:9px;font-weight:800;color:var(--ipon-green);background:var(--ipon-green-soft);border-radius:999px;padding:5px 8px;white-space:nowrap;}
  .settings-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid #EEF0EB;}
  .settings-row:first-of-type{border-top:0;}
  .settings-row span:first-child{min-width:0;}
  .settings-row strong{display:block;font-size:11px;font-weight:800;color:var(--ipon-ink);}
  .settings-row small{display:block;font-size:9px;line-height:1.45;color:var(--ipon-muted);margin-top:3px;}
  .settings-row input[type="checkbox"]{margin:0;}
  .settings-field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:4px;}
  .settings-field{display:grid;gap:5px;}
  .settings-field label{font-size:9px;font-weight:800;color:var(--ipon-muted);}
  .settings-field input{width:100%;box-sizing:border-box;min-height:40px;border-radius:10px;padding:8px 10px;background:#FBFAF6;border:1px solid var(--ipon-border);color:var(--ipon-ink);}
  .settings-wallet-list{display:grid;gap:8px;margin-top:8px;}
  .settings-wallet-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border-radius:12px;background:#FAFBF8;border:1px solid #EEF0EB;}
  .settings-wallet-main{display:flex;align-items:center;gap:9px;min-width:0;}
  .settings-wallet-logo{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px;flex:0 0 auto;}
  .settings-wallet-name{font-size:10px;font-weight:800;}
  .settings-wallet-note{font-size:8px;color:var(--ipon-muted);margin-top:2px;}
  .settings-status{font-size:8px;font-weight:800;border-radius:999px;padding:5px 7px;white-space:nowrap;}
  .settings-status.connected{background:#E8F4EE;color:var(--ipon-green);}
  .settings-status.available{background:#F4F1E8;color:#80621E;}

<body>
<div id="root" aria-live="polite"></div>

<script>
"use strict";

/* ================= constants ================= */
// Backend that talks to Xendit (this static HTML file never holds a Xendit secret key).
// Override by setting window.IPON_API_BASE before this script runs, e.g. in a <script> tag
// or via ?api=https://your-backend.example.com in the URL.
const API_BASE = (() => {
  try {
    const qp = new URLSearchParams(location.search).get("api");
    return (qp || window.IPON_API_BASE || "http://localhost:8787").replace(/\/$/, "");
  } catch (e) { return "http://localhost:8787"; }
})();
// Paste the Client ID from Google Cloud Console > APIs & Services > Credentials here,
// or override via window.IPON_GOOGLE_CLIENT_ID / ?google_client_id= in the URL.
const GOOGLE_CLIENT_ID = (() => {
  try {
    const qp = new URLSearchParams(location.search).get("google_client_id");
    return qp || window.IPON_GOOGLE_CLIENT_ID || "18762994135-k64mot8jl81oic0ut2l1vjbm3e9av332.apps.googleusercontent.com";
  } catch (e) { return "PASTE_YOUR_GOOGLE_CLIENT_ID_HERE.apps.googleusercontent.com"; }
})();
const STORAGE_KEY = "ipon-io-data";
const TRIAL_DAYS = 7;
const FIRST_MONTH_PRICE = 49;
const REGULAR_MONTH_PRICE = 99;
const SOURCE_COLORS = { gcash: "#1479FF", manual: "#6B7060", withdrawal: "#B5432F" };

/* ================= icons ================= */
const ICON_PATHS = {

  piggybank: '<path d="M4 12a5 5 0 015-5h6a5 5 0 015 5v2a2 2 0 01-2 2h-1v2h-2v-2H9v2H7v-2H6a2 2 0 01-2-2v-2z"/><circle cx="15" cy="10" r=".7" fill="currentColor" stroke="none"/><path d="M4 12H2.5" />',

  user: '<circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
  check: '<polyline points="5 13 9 17 19 7"/>',

  logOut: '<path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M21 3v18"/>',
};
function icon(name, size, color) {
  size = size || 14;
  const p = ICON_PATHS[name] || "";
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color || "currentColor"}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
}
function googleGIcon(size) {
  size = size || 18;
  return `<svg width="${size}" height="${size}" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/><path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.348 2.825.957 4.039l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 6.293C4.672 4.166 6.656 3.58 9 3.58z"/></svg>`;
}

/* ================= helpers ================= */
function uid() { return `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`; }
function formatPHP(n) {
  const num = Number(n) || 0;
  return num.toLocaleString("en-PH", { style: "currency", currency: "PHP", minimumFractionDigits: 0, maximumFractionDigits: 0 });
}
function todayISO() { return new Date().toISOString(); }
function dateKey(iso) { return (iso || "").slice(0, 10); }
function monthKey(iso) { return (iso || "").slice(0, 7); }
function monthLabel(key) {
  const parts = key.split("-").map(Number);
  return new Date(parts[0], parts[1] - 1, 1).toLocaleDateString("en-PH", { month: "short" });
}
function formatShortDate(iso) {
  try { return new Date(iso).toLocaleDateString("en-PH", { month: "short", day: "numeric" }); } catch (e) { return ""; }
}
function formatLongDate(dateStr) {
  try { return new Date(dateStr).toLocaleDateString("en-PH", { month: "long", day: "numeric", year: "numeric" }); } catch (e) { return dateStr; }
}
function relativeDayLabel(iso) {
  const dk = dateKey(iso);
  if (dk === dateKey(todayISO())) return "Today";
  const y = new Date(); y.setDate(y.getDate() - 1);
  if (dk === dateKey(y.toISOString())) return "Yesterday";
  return formatShortDate(iso);
}
function daysUntil(dateStr) {
  if (!dateStr) return null;
  return Math.ceil((new Date(dateStr) - new Date(new Date().toDateString())) / 86400000);
}
function last6MonthKeys() {
  const keys = [];
  const now = new Date();
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    keys.push(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`);
  }
  return keys;
}
function escapeHtml(str) {
  return String(str == null ? "" : str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function sourceLabel(source) {
  if (source === "gcash") return "GCash";
  if (source === "withdrawal") return "Withdrawal";
  return "Manual";
}

/* ================= state ================= */
function defaultData() {
  return {
    enabled: true,          // master on/off for spare-money suggestions
    autoSuggest: true,      // auto-check on load vs. manual "Check" only
    paused: false,          // temporary pause without turning the feature off
    manualApproval: true,   // informational; every collection always requires an explicit tap regardless
    minWalletBalance: 500,
    dailyLimit: 60,
    monthlyLimit: 500,
    wallets: { gcash: 1000 }, // SIMULATED GCash balance — no real GCash link exists here
    collections: [],        // {id, source:'gcash'|'manual'|'withdrawal', amount, date, status:'completed'|'cancelled', priorityId}
    priorities: [],         // {id, name, target, withdrawDate, withdrawn, withdrawnAmount, withdrawnAt}
    activePriorityId: null, // which priority new spare-money collections count toward (null = general savings)
    // Google sign-in is still simulated locally. GCash linking is real: gcashConnected/gcashPaymentMethodId
    // reflect the status of a Xendit Payment Method (type EWALLET, channel GCASH) tracked by the backend.
    account: { google: null, knownGoogleAccount: null, gcashConnected: false, gcashPaymentMethodId: null },
    subscription: {
      trialStartedAt: null,
      paidAt: null,
      paidMonth: 0,
      active: true
    }
  };
}

let DATA = defaultData();
let UI = {
  tab: "home",
  suggestion: null,
  showFullHistory: false,
  customAmount: "",
  manualAmount: "",
  confirmReset: false,
  homeWithdrawConfirm: false,
  homeWithdrawSuccess: null,
  scheduleDraft: { purpose: "", amount: "", date: "" },
  scheduleSuccess: null,
  prioritiesDraft: { showForm: false, name: "", target: "", withdrawDate: "", addingTo: null, addAmount: "", confirmDelete: null, confirmWithdraw: null },
  accountDraft: { consentFor: null },
  lastObservedGcashBalance: null,
  // status: "idle" | "starting" | "pending" (waiting on GCash authorization) | "error"
  gcashLink: { status: "idle", authUrl: null, error: null },
  gcashCollectError: null,
  collectionInFlight: false,
  googleAuthError: null,
};
let charts = { bar: null, line: null, pie: null };

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const d = JSON.parse(raw);
      const fresh = defaultData();
      Object.assign(fresh, d);
      fresh.wallets = { gcash: Number((d.wallets || {}).gcash ?? 1000) || 0 };
      fresh.collections = d.collections || [];
      fresh.priorities = d.priorities || [];
      fresh.account = Object.assign({ google: null, knownGoogleAccount: null, gcashConnected: false, gcashPaymentMethodId: null }, d.account || {});
      fresh.subscription = Object.assign({
        trialStartedAt: null, paidAt: null, paidMonth: 0, active: true
      }, d.subscription || {});
      DATA = fresh;
    }
  } catch (e) { /* fresh start */ }
}
function persist() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); } catch (e) { console.error("save failed", e); }
}

/* ================= small shared UI ================= */
function statCard(label, value, tone) {
  return `<div class="sm-card p-3" style="border-left:3px solid ${tone || "#2F5D4E"}">
    <p class="text-xs" style="color:#6B7060">${escapeHtml(label)}</p>
    <p class="sm-display text-lg font-semibold mt-0.5">${value}</p>
  </div>`;
}
function progressBar(pct, tone) {
  tone = tone || "ok";
  const clamped = Math.max(0, Math.min(100, pct));
  return `<div class="sm-progress-track w-full"><div class="sm-progress-fill ${tone}" style="width:${clamped}%"></div></div>`;
}

/* ================= subscription / pricing logic ================= */
function ensureTrialStarted() {
  if (!DATA.subscription.trialStartedAt && !DATA.subscription.paidAt) {
    DATA.subscription.trialStartedAt = new Date().toISOString();
    DATA.subscription.active = true;
    persist();
  }
}

function trialDaysLeft() {
  ensureTrialStarted();
  if (DATA.subscription.paidAt) return 0;
  const started = new Date(DATA.subscription.trialStartedAt);
  const elapsed = Date.now() - started.getTime();
  return Math.max(0, TRIAL_DAYS - Math.ceil(elapsed / 86400000));
}

function trialActive() {
  const active = !DATA.subscription.paidAt && trialDaysLeft() > 0;
  if (!active && !DATA.subscription.paidAt) DATA.subscription.active = false;
  return active;
}

function premiumActive() {
  if (DATA.subscription.paidAt) return DATA.subscription.active !== false;
  return trialActive();
}

function subscriptionStatusText() {
  if (DATA.subscription.paidAt) {
    return DATA.subscription.paidMonth >= 2
      ? "Premium Active · ₱99/month"
      : "Premium Active · ₱49 first month";
  }
  const d = trialDaysLeft();
  return d > 0 ? `7-Day Free Trial · ${d} day${d === 1 ? "" : "s"} left` : "Trial Expired · Premium Disabled";
}

function activatePaidPlan() {
  DATA.subscription.paidAt = new Date().toISOString();
  DATA.subscription.paidMonth = 1;
  DATA.subscription.active = true;
  persist();
}

function renderSubscriptionCard() {
  ensureTrialStarted();
  const paid = !!DATA.subscription.paidAt;
  const trial = trialActive();

  if (paid) {
    return `
      <section class="sm-card sm-card-accent p-4 space-y-2">
        <div class="flex items-center justify-between gap-2">
          <p class="text-sm font-medium">ipon.io Premium</p>
          <span class="sm-tag" style="background:#E9F2EE;color:#2F5D4E">ACTIVE</span>
        </div>
        <p class="sm-display text-3xl font-bold">₱99<span class="text-sm font-medium" style="color:#6B7060">/month</span></p>
        <p class="text-xs" style="color:#6B7060">Your introductory month was ₱49. Your regular price is ₱99/month from the second month onward.</p>

/* ================= spare money + priorities logic ================= */
function completedCollections() { return DATA.collections.filter((c) => c.status === "completed"); }
function spareMoneyToday() {
  const today = dateKey(todayISO());
  return completedCollections().filter((c) => (c.source === "gcash") && dateKey(c.date) === today).reduce((a, c) => a + c.amount, 0);
}
function spareMoneyThisMonth() {
  const mk = monthKey(todayISO());
  return completedCollections().filter((c) => (c.source === "gcash") && monthKey(c.date) === mk).reduce((a, c) => a + c.amount, 0);
}
function spareMoneyTotal() { return completedCollections().reduce((a, c) => a + c.amount, 0); }
function totalWithdrawn() { return completedCollections().filter((c) => c.amount < 0).reduce((a, c) => a - c.amount, 0); }
// Money not tagged to any priority — this is what Home Withdrawal is allowed to touch.
// Priority-held money (c.priorityId set) is deliberately excluded so a Home withdrawal
// can never reach into an active Priority's locked or unlocked balance.
function generalSavingsAvailable() { return completedCollections().filter((c) => !c.priorityId).reduce((a, c) => a + c.amount, 0); }
function prioritySaved(priorityId) { return completedCollections().filter((c) => c.priorityId === priorityId).reduce((a, c) => a + c.amount, 0); }
function activePriority() { return DATA.activePriorityId ? DATA.priorities.find((p) => p.id === DATA.activePriorityId) || null : null; }
function isPriorityLocked(p) {
  const d = daysUntil(p.withdrawDate);
  return d !== null && d > 0;
}
// Priorities sorted by soonest scheduled withdrawal date — this answers "what's coming up next",
// which is a different question from activePriority() (which one new spare money routes to).
function upcomingPriorities() {
  return DATA.priorities.filter((p) => !p.withdrawn).sort((a, b) => daysUntil(a.withdrawDate) - daysUntil(b.withdrawDate));
}
function nextPriority() {
  const list = upcomingPriorities();
  return list.length ? list[0] : null;
}
// If the active priority has already hit its target, new spare money should fall back to
// general savings (Home) instead of continuing to pile into an already-funded priority.
function maybeReleaseActivePriority() {
  if (!DATA.activePriorityId) return;
  const p = DATA.priorities.find((x) => x.id === DATA.activePriorityId);
  if (p && !p.withdrawn && prioritySaved(p.id) >= p.target) {
    DATA.activePriorityId = null;
  }
}

// Spare money = the "loose change" above the nearest lower ₱100 in a wallet balance —
// a simple, explainable stand-in for whatever leftover-detection GCash API would provide.
function computeSpareMoney(balance) {
  const raw = Number(balance) % 100;
  return Math.round(raw * 100) / 100;
}
function checkSpareMoney(source) {
  if (source !== "gcash") return;
  const balance = Number(DATA.wallets.gcash) || 0;
  UI.lastObservedGcashBalance = balance;
  const raw = computeSpareMoney(balance);
  const base = { source, balance, raw, amount: 0, maxAllowed: 0, belowMinimum: false, blockedReason: null, customizing: false };

  if (!DATA.enabled) { UI.suggestion = { ...base, blockedReason: "Spare-money suggestions are turned off in Settings." }; return; }
  if (DATA.paused) { UI.suggestion = { ...base, blockedReason: "Saving with ipon.io is currently paused." }; return; }
  if (raw < 3) { UI.suggestion = { ...base, belowMinimum: true }; return; }

  const remainingDaily = Math.max(0, DATA.dailyLimit - spareMoneyToday());
  const remainingMonthly = Math.max(0, DATA.monthlyLimit - spareMoneyThisMonth());
  const remainingBalanceRoom = Math.max(0, balance - DATA.minWalletBalance);
  const maxAllowed = Math.floor(Math.min(30, raw, remainingDaily, remainingMonthly, remainingBalanceRoom));

  if (maxAllowed < 3) {
    let reason = "No spare money can be collected right now.";
    if (remainingDaily < 3) reason = `You've reached today's ${formatPHP(DATA.dailyLimit)} daily collection limit.`;
    else if (remainingMonthly < 3) reason = `You've reached this month's ${formatPHP(DATA.monthlyLimit)} monthly collection limit.`;
    else if (remainingBalanceRoom < 3) reason = `Collecting would take ${sourceLabel(source)} below your ${formatPHP(DATA.minWalletBalance)} minimum balance.`;
    UI.suggestion = { ...base, blockedReason: reason };
    return;
  }

  UI.suggestion = { ...base, amount: maxAllowed, maxAllowed };
  UI.customAmount = String(maxAllowed);
}
async function confirmSpareCollection() {
  const sug = UI.suggestion;
  if (!sug || sug.belowMinimum || sug.blockedReason) return;
  const amount = Math.max(3, Math.min(30, sug.amount));

  // Real GCash link via Xendit: actually pull the confirmed amount from the user's
  // linked GCash into the ipon.io Xendit balance. Detection above is still a local
  // heuristic (Xendit/GCash expose no API to read a live wallet balance) — only the
  // money movement for the confirmed amount is real once GCash is connected.
  if (sug.source === "gcash" && DATA.account.gcashConnected) {
    UI.collectionInFlight = true;
    UI.gcashCollectError = null;
    render();
    try {
      const data = await apiFetch("/api/gcash/collect", {
        method: "POST",
        body: JSON.stringify({ amount, referenceId: uid() }),
      });
      const status = data.status === "SUCCEEDED" ? "completed" : data.status === "PENDING" ? "pending" : "failed";
      DATA.collections = [{ id: data.id || uid(), source: "gcash", amount: +amount.toFixed(2), date: todayISO(), status, priorityId: DATA.activePriorityId || null, live: true }, ...DATA.collections];
      if (status !== "failed") {
        DATA.wallets.gcash = +((Number(DATA.wallets.gcash) || 0) - amount).toFixed(2);
        maybeReleaseActivePriority();
        UI.suggestion = null;
      } else {
        UI.gcashCollectError = "Xendit reported this collection failed. Nothing was saved.";
      }
    } catch (e) {
      UI.gcashCollectError = e.message || "Could not reach the ipon.io server to collect this amount.";
    } finally {
      UI.collectionInFlight = false;
      persist();
      render();
    }
    return;
  }

  // GCash not linked yet (or a non-GCash source): local simulation only, as before.
  DATA.wallets[sug.source] = +((Number(DATA.wallets[sug.source]) || 0) - amount).toFixed(2);
  DATA.collections = [{ id: uid(), source: sug.source, amount: +amount.toFixed(2), date: todayISO(), status: "completed", priorityId: DATA.activePriorityId || null, simulated: true }, ...DATA.collections];
  maybeReleaseActivePriority();
  UI.suggestion = null;
  persist();
}

/* ================= Google sign-in (real, via Google Identity Services) ================= */
let googleTokenClient = null;
let googleGisReady = false;

function initGoogleAuth() {
  if (googleGisReady) return true;
  if (!window.google || !google.accounts || !google.accounts.oauth2) return false;
  if (!GOOGLE_CLIENT_ID || GOOGLE_CLIENT_ID.startsWith("PASTE_YOUR_")) return false;

  googleTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: "openid email profile",
    callback: async (response) => {
      if (response.error) {
        UI.googleAuthError = response.error === "access_denied"
          ? "Google sign-in was cancelled."
          : `Google sign-in failed (${response.error}).`;
        render();
        return;
      }
      try {
        const profileRes = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
          headers: { Authorization: `Bearer ${response.access_token}` },
        });
        if (!profileRes.ok) throw new Error("Could not fetch your Google profile.");
        const profile = await profileRes.json();
        DATA.account.google = {
          name: profile.name || profile.given_name || "Google user",
          email: profile.email || "",
          picture: profile.picture || null,
          sub: profile.sub,
        };
        UI.googleAuthError = null;
        persist();
      } catch (e) {
        UI.googleAuthError = e.message || "Could not complete Google sign-in.";
      }
      render();
    },
  });
  googleGisReady = true;
  return true;
}

function requestGoogleSignIn() {
  UI.googleAuthError = null;
  const ready = initGoogleAuth();
  if (!ready) {
    UI.googleAuthError = !window.google
      ? "Google's sign-in script hasn't loaded yet — check your connection and try again."
      : "This app doesn't have a Google Client ID configured yet.";
    render();
    return;
  }
  googleTokenClient.requestAccessToken();
}


async function apiFetch(path, options) {
  let res;
  try {
    res = await fetch(`${API_BASE}${path}`, {
      headers: { "Content-Type": "application/json" },
      ...(options || {}),
    });
  } catch (e) {
    throw new Error(`Can't reach the ipon.io backend at ${API_BASE}. Is it running?`);
  }
  let data = {};
  try { data = await res.json(); } catch (e) { /* no body */ }
  if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
  return data;
}

async function syncGcashStatus() {
  try {
    const data = await apiFetch("/api/gcash/status");
    DATA.account.gcashConnected = !!data.linked;
    DATA.account.gcashPaymentMethodId = data.paymentMethodId || null;
    if (data.linked) UI.gcashLink = { status: "idle", authUrl: null, error: null };
    persist();
  } catch (e) {
    // Backend unreachable — leave last-known local state; errors surface when the
    // user actively tries to connect/collect instead of nagging on every tab switch.
  }
}

let gcashPollTimer = null;
function stopGcashPolling() {
  if (gcashPollTimer) { clearTimeout(gcashPollTimer); gcashPollTimer = null; }
}

function pollGcashLink() {
  stopGcashPolling();
  gcashPollTimer = setTimeout(async () => {
    if (UI.gcashLink.status !== "pending") return;
    try {
      const data = await apiFetch("/api/gcash/status");
      if (data.status === "ACTIVE") {
        DATA.account.gcashConnected = true;
        DATA.account.gcashPaymentMethodId = data.paymentMethodId || null;
        UI.gcashLink = { status: "idle", authUrl: null, error: null };
        persist(); render();
        return;
      }
      if (data.status === "FAILED" || data.status === "INACTIVE") {
        UI.gcashLink = { status: "idle", authUrl: null, error: "GCash authorization wasn't completed. You can try again." };
        render();
        return;
      }
    } catch (e) { /* transient error while polling — keep trying */ }
    pollGcashLink();
  }, 3000);
}

async function startGcashLink() {
  UI.gcashLink = { status: "starting", authUrl: null, error: null };
  render();
  try {
    const data = await apiFetch("/api/gcash/link", { method: "POST" });
    if (data.status === "ACTIVE") {
      DATA.account.gcashConnected = true;
      DATA.account.gcashPaymentMethodId = data.paymentMethodId || null;
      UI.gcashLink = { status: "idle", authUrl: null, error: null };
      persist();
    } else if (data.authUrl) {
      UI.gcashLink = { status: "pending", authUrl: data.authUrl, error: null };
      window.open(data.authUrl, "_blank", "noopener");
      pollGcashLink();
    } else {
      UI.gcashLink = { status: "idle", authUrl: null, error: "Xendit didn't return an authorization link." };
    }
  } catch (e) {
    UI.gcashLink = { status: "idle", authUrl: null, error: e.message || "Could not start GCash linking." };
  }
  render();
}

function cancelGcashLink() {
  stopGcashPolling();
  UI.gcashLink = { status: "idle", authUrl: null, error: null };
}

async function disconnectGcash() {
  try {
    await apiFetch("/api/gcash/disconnect", { method: "POST" });
  } catch (e) {
    // Still clear locally so the UI isn't stuck if the backend call failed —
    // worst case the payment method stays ACTIVE on Xendit until retried.
  }
  DATA.account.gcashConnected = false;
  DATA.account.gcashPaymentMethodId = null;
  persist();
}
function dismissSpareCollection(logAsCancelled) {
  const sug = UI.suggestion;
  if (logAsCancelled && sug && !sug.belowMinimum && !sug.blockedReason) {
    DATA.collections = [{ id: uid(), source: sug.source, amount: sug.amount, date: todayISO(), status: "cancelled", priorityId: DATA.activePriorityId || null }, ...DATA.collections];
    persist();
  }
  UI.suggestion = null;
}
function applyCustomSpareAmount() {
  const sug = UI.suggestion;
  if (!sug) return;
  const v = parseFloat(UI.customAmount);
  const clamped = Math.max(3, Math.min(sug.maxAllowed, isNaN(v) ? sug.maxAllowed : v));
  sug.amount = Math.round(clamped);
  sug.customizing = false;
}
function addPriority(p) {
  const rec = { id: uid(), withdrawn: false, withdrawnAmount: 0, withdrawnAt: null, ...p };
  DATA.priorities = [...DATA.priorities, rec];
  if (!DATA.activePriorityId) DATA.activePriorityId = rec.id;
  persist();
}
function deletePriority(id) {
  DATA.priorities = DATA.priorities.filter((p) => p.id !== id);
  DATA.collections = DATA.collections.map((c) => (c.priorityId === id ? { ...c, priorityId: null } : c));
  if (DATA.activePriorityId === id) DATA.activePriorityId = null;
  persist();
}
function addManualContribution(priorityId, amount) {
  DATA.collections = [{ id: uid(), source: "manual", amount: +amount.toFixed(2), date: todayISO(), status: "completed", priorityId: priorityId || null }, ...DATA.collections];
  maybeReleaseActivePriority();
  persist();
}
function withdrawPriority(id) {
  const p = DATA.priorities.find((x) => x.id === id);
  if (!p || p.withdrawn || isPriorityLocked(p)) return;
  const amount = prioritySaved(id);
  if (amount > 0) {
    DATA.collections = [{ id: uid(), source: "withdrawal", amount: -amount, date: todayISO(), status: "completed", priorityId: id }, ...DATA.collections];
  }
  p.withdrawn = true;
  p.withdrawnAmount = amount;
  p.withdrawnAt = todayISO();
  if (DATA.activePriorityId === id) DATA.activePriorityId = null;
  persist();
}
// Home Withdrawal: pulls only from general (unassigned) savings — priorityId stays null,
// so this can never touch money already earmarked for a Priority.
function withdrawGeneralSavings(amount) {
  const available = generalSavingsAvailable();
  const amt = Math.min(amount, available);
  if (amt <= 0) return 0;
  DATA.collections = [{ id: uid(), source: "withdrawal", amount: -amt, date: todayISO(), status: "completed", priorityId: null }, ...DATA.collections];
  persist();
  return amt;
}

/* ================= tab: my priorities ================= */
function savingsGoalStats() {
  const goals = DATA.priorities.filter(p => !p.withdrawn);
  const saved = goals.reduce((sum, p) => sum + prioritySaved(p.id), 0);
  const target = goals.reduce((sum, p) => sum + Number(p.target || 0), 0);
  return { goals, saved, target, pct: target > 0 ? Math.min(100, (saved / target) * 100) : 0 };
}

function goalState(p, saved) {
  if (p.withdrawn) return { label: "Completed", cls: "completed" };
  if (saved >= Number(p.target || 0)) {
    return isPriorityLocked(p) ? { label: "Locked", cls: "locked" } : { label: "Ready", cls: "ready" };
  }
  return isPriorityLocked(p) ? { label: "Locked", cls: "locked" } : { label: "Active", cls: "active" };
}

function renderPriorityCard(p) {
  const d = UI.prioritiesDraft;
  const saved = prioritySaved(p.id);
  const target = Number(p.target || 0);
  const pct = target > 0 ? Math.min(100, (saved / target) * 100) : 0;
  const remaining = Math.max(0, target - saved);
  const dLeft = daysUntil(p.withdrawDate);
  const locked = isPriorityLocked(p);
  const isActive = DATA.activePriorityId === p.id;
  const state = goalState(p, saved);

  const deleteBlock = d.confirmDelete === p.id
    ? `<span class="text-xs flex items-center gap-2">Delete?
        <button data-action="confirm-delete-priority" data-id="${p.id}" style="color:#B5432F;font-weight:700">Yes</button>
        <button data-action="cancel-delete-priority" style="color:#6B7060">No</button>
      </span>`
    : `<button data-action="ask-delete-priority" data-id="${p.id}" aria-label="Delete goal">${icon("trash", 15, "#B5432F")}</button>`;

  if (p.withdrawn) {
    return `
      <article class="goal-card goal-completed sm-card">
        <div class="goal-card-head">
          <div>
            <p class="goal-name">${escapeHtml(p.name)}</p>
            <span class="goal-status completed">Completed</span>
          </div>
          ${deleteBlock}
        </div>
        <div class="goal-amount-row">
          <div><span class="goal-label">Saved</span><strong>${formatPHP(p.withdrawnAmount)}</strong></div>
          <div class="goal-date">Used on ${formatShortDate(p.withdrawnAt)}</div>
        </div>
        <p class="goal-note">${icon("check", 11, "#2F6B52")} Goal completed and withdrawn.</p>
      </article>`;
  }

  let lockLine = "";
  if (locked) {
    lockLine = `<p class="goal-note locked-note">${icon("lock", 12, "#9C6C1F")} Locked until ${formatLongDate(p.withdrawDate)}${dLeft > 0 ? ` · ${dLeft} day${dLeft === 1 ? "" : "s"} left` : ""}</p>`;
  } else if (saved >= target) {
    lockLine = `<p class="goal-note ready-note">${icon("unlock", 12, "#2F6B52")} Ready — withdrawal date has arrived.</p>`;
  }

  const withdrawRow = (!locked && saved > 0) ? (
    d.confirmWithdraw === p.id
      ? `<div class="goal-confirm"><span>Use ${formatPHP(saved)} now?</span>
          <button data-action="confirm-withdraw" data-id="${p.id}" class="sm-btn-primary">Yes, use it</button>
          <button data-action="cancel-withdraw" class="sm-btn-ghost">Cancel</button>
        </div>`
      : `<button data-action="ask-withdraw" data-id="${p.id}" class="goal-use-btn">${icon("unlock", 14)} Use saved money</button>`
  ) : "";

  const addBlock = d.addingTo === p.id
    ? `<div class="goal-add-form">
        <input autofocus class="sm-input" type="number" min="1" placeholder="Amount (₱)" data-draft="prioritiesDraft.addAmount" value="${escapeHtml(d.addAmount)}" />
        <button data-action="submit-priority-add" data-id="${p.id}" class="sm-btn-primary">Add money</button>
        <button data-action="cancel-adding-to" class="sm-btn-ghost" aria-label="Cancel">${icon("x", 13)}</button>
      </div>`
    : `<div class="goal-actions">
        <button data-action="set-adding-to" data-id="${p.id}" class="goal-add-btn">${icon("plus", 14)} Add money</button>
        <button data-action="set-active-priority" data-id="${p.id}" class="goal-spare-btn ${isActive ? "selected" : ""}">
          ${isActive ? icon("check", 14) + " Spare money goes here" : icon("piggybank", 14) + " Use for spare money"}
        </button>
      </div>`;

  return `
    <article class="goal-card sm-card ${isActive ? "goal-active" : ""}">
      <div class="goal-card-head">
        <div class="goal-title-wrap">
          <p class="goal-name">${escapeHtml(p.name)}</p>
          <div class="goal-meta">
            <span class="goal-status ${state.cls}">${state.label}</span>
            ${isActive ? `<span class="goal-route">Spare-money destination</span>` : ""}
          </div>
        </div>
        ${deleteBlock}
      </div>

      <div class="goal-amounts">
        <div>
          <span class="goal-label">Saved</span>
          <strong class="goal-saved">${formatPHP(saved)}</strong>
        </div>
        <div class="goal-remaining">
          <span class="goal-label">${remaining > 0 ? "Remaining" : "Target"}</span>
          <strong>${formatPHP(remaining > 0 ? remaining : target)}</strong>
        </div>
      </div>

      <div class="goal-progress-top">
        <span>${Math.round(pct)}% complete</span>
        <span>Goal ${formatPHP(target)}</span>
      </div>
      <div class="goal-progress">${progressBar(pct, pct >= 100 ? "ok" : "ok")}</div>

      <p class="goal-date">${icon("target", 12, "#68736B")} Withdraw date: ${formatLongDate(p.withdrawDate)}</p>
      ${lockLine}
      ${withdrawRow}
      ${addBlock}
    </article>`;
}

function renderPriorities() {

  const d = UI.prioritiesDraft;
  const stats = savingsGoalStats();
  const activeCount = stats.goals.filter(p => prioritySaved(p.id) < Number(p.target || 0)).length;
  const readyCount = stats.goals.filter(p => !isPriorityLocked(p) && prioritySaved(p.id) > 0).length;
  const completed = DATA.priorities.filter(p => p.withdrawn);

  const formHtml = d.showForm ? `
    <section class="goal-create sm-card">
      <div class="goal-create-head">

      </label>

      <div class="goal-form-actions">

  const activeGoals = DATA.priorities.filter(p => !p.withdrawn);

  const completedHtml = completed.length ? `
    <section class="completed-goals-section">
      <div class="section-heading"><div><h3>Completed goals</h3><p>Goals you've already used</p></div><span>${completed.length}</span></div>
      <div class="goal-list completed-list">${completed.map(renderPriorityCard).join("")}</div>
    </section>` : "";

  return `
    <section class="goals-header">
      <div class="goals-heading-row">
        <div>
          <p class="eyebrow">My Priorities</p>
          <h2>Savings Goals</h2>
          <p>Save with a clear purpose, track your progress, and keep important money protected.</p>
        </div>
        <div class="goals-target-icon">${icon("target", 24, "#1F6B52")}</div>
      </div>

      <div class="overall-goal sm-card">
        <div class="overall-top">
          <div><span class="goal-label">Overall savings-goal progress</span><strong>${formatPHP(stats.saved)}</strong><span class="overall-target">of ${formatPHP(stats.target)} target</span></div>
          <div class="overall-percent">${Math.round(stats.pct)}%</div>
        </div>

        <div class="overall-bottom">
          <span>${stats.goals.length} active goal${stats.goals.length === 1 ? "" : "s"}</span>

      </div>

      <div class="goal-summary-grid">

        <div class="goal-mini sm-card"><span>Saved</span><strong>${formatPHP(stats.saved)}</strong></div>
        <div class="goal-mini sm-card"><span>Remaining</span><strong>${formatPHP(Math.max(0, stats.target - stats.saved))}</strong></div>
      </div>
    </section>

    <div class="goal-section-bar">
      <div><h3>Active goals</h3><p>Choose where your next spare money goes.</p></div>
      ${formHtml}

function reportMetrics() {
  const completed = completedCollections();
  const positive = completed.filter(c => Number(c.amount) > 0);
  const withdrawals = completed.filter(c => Number(c.amount) < 0);
  const saved = positive.reduce((sum,c) => sum + Number(c.amount || 0), 0);
  const withdrawn = withdrawals.reduce((sum,c) => sum + Math.abs(Number(c.amount || 0)), 0);
  const net = Math.max(0, saved - withdrawn);
  const avg = positive.length ? saved / positive.length : 0;
  const months = last6MonthKeys();
  const monthly = months.map(k => ({
    key:k,
    label:monthLabel(k),
    value:positive.filter(c => monthKey(c.date) === k).reduce((sum,c) => sum + Number(c.amount || 0), 0)
  }));
  const bestMonth = monthly.reduce((best,m) => m.value > best.value ? m : best, {label:"—",value:0});
  const currentKey = monthKey(todayISO());
  const currentMonth = monthly.find(m => m.key === currentKey) || {label:monthLabel(currentKey),value:0};
  const goals = DATA.priorities.filter(p => !p.withdrawn);
  const completedGoals = DATA.priorities.filter(p => p.withdrawn);
  const goalSaved = goals.reduce((sum,p) => sum + prioritySaved(p.id), 0);
  const goalTarget = goals.reduce((sum,p) => sum + Number(p.target || 0), 0);
  const goalPct = goalTarget > 0 ? Math.min(100, (goalSaved / goalTarget) * 100) : 0;
  const sourceTotals = { gcash:0, manual:0 };
  positive.forEach(c => { sourceTotals[c.source] = (sourceTotals[c.source] || 0) + Number(c.amount || 0); });
  return {completed, positive, saved, withdrawn, net, avg, monthly, bestMonth, currentMonth, goals, completedGoals, goalSaved, goalTarget, goalPct, sourceTotals};
}

function initCharts() {
  const m = reportMetrics();

  if (charts.bar) { charts.bar.destroy(); charts.bar = null; }
  if (charts.line) { charts.line.destroy(); charts.line = null; }
  if (charts.pie) { charts.pie.destroy(); charts.pie = null; }

  const commonScales = {
    x: {grid:{display:false},ticks:{color:"#68736B",font:{size:10},maxRotation:0}},
    y: {beginAtZero:true,ticks:{color:"#68736B",font:{size:10},callback:(v)=>formatPHP(v)},grid:{color:"#E7EBE5"}}
  };

  const barCtx = document.getElementById("chart-bar");
  if (barCtx && window.Chart) {
    charts.bar = new Chart(barCtx, {
      type:"bar",
      data:{
        labels:m.monthly.map(x=>x.label),
        datasets:[{
          data:m.monthly.map(x=>x.value),
          backgroundColor:"#1F6B52",
          hoverBackgroundColor:"#174E3C",
          borderRadius:7,
          borderSkipped:false,
          maxBarThickness:34
        }]
      },
      options:{
        responsive:true,
        maintainAspectRatio:false,
        animation:{duration:500},
        plugins:{
          legend:{display:false},
          tooltip:{displayColors:false,callbacks:{label:(ctx)=>` ${formatPHP(ctx.parsed.y)}`}}
        },
        scales:commonScales
      }
    });
  }

  const growth = [];
  let cumulative = 0;
  m.monthly.forEach(x => { cumulative += x.value; growth.push({label:x.label,value:cumulative}); });

  const lineCtx = document.getElementById("chart-line");
  if (lineCtx && window.Chart) {
    charts.line = new Chart(lineCtx, {
      type:"line",
      data:{
        labels:growth.map(x=>x.label),

          data:growth.map(x=>x.value),
          borderColor:"#C98A2C",

          pointRadius:3,
          pointHoverRadius:5,

          pointBorderWidth:0,
          fill:true,
          tension:.35
        }]
      },
      options:{
        responsive:true,
        maintainAspectRatio:false,
        animation:{duration:500},
        plugins:{
          legend:{display:false},
          tooltip:{displayColors:false,callbacks:{label:(ctx)=>` ${formatPHP(ctx.parsed.y)}`}}
        },
        scales:commonScales
      }
    });
  }

  const pieWrap = document.getElementById("pie-wrap");
  const pieEntries = Object.entries(m.sourceTotals).filter(([,v])=>v>0);
  if (pieWrap) {
    if (!pieEntries.length) {
      pieWrap.innerHTML = `<div class="reports-empty">No completed savings contributions yet.<br>Your source breakdown will appear here once you start saving.</div>`;
    } else {
      pieWrap.innerHTML = `<canvas id="chart-pie"></canvas>`;
      const pieCtx = document.getElementById("chart-pie");
      if (pieCtx && window.Chart) {
        charts.pie = new Chart(pieCtx, {
          type:"doughnut",
          data:{
            labels:pieEntries.map(([k])=>sourceLabel(k)),
            datasets:[{
              data:pieEntries.map(([,v])=>v),
              backgroundColor:pieEntries.map(([k])=>SOURCE_COLORS[k] || "#6B7060"),
              borderColor:"#FFFFFF",
              borderWidth:3,
              hoverOffset:5
            }]
          },
          options:{
            responsive:true,
            maintainAspectRatio:false,
            cutout:"62%",
            animation:{duration:500},
            plugins:{
              legend:{position:"bottom",labels:{color:"#26362F",font:{size:10},padding:14,usePointStyle:true,pointStyle:"circle"}},
              tooltip:{callbacks:{label:(ctx)=>`${ctx.label}: ${formatPHP(ctx.parsed)}`}}

          <div class="flex items-center justify-between gap-3">

              <span style="width:38px;height:38px;border-radius:12px;background:#E8F4EE;display:flex;align-items:center;justify-content:center">
                ${icon("piggybank", 21, "#1F6B52")}
              </span>
              <div>
                <h1 class="sm-display text-lg font-bold" style="line-height:1">ipon.io</h1>
                <p style="font-size:11px;color:#7A837D;margin-top:4px">Smart spare-money saving</p>
              </div>
            </div>
          </div>
          <button data-action="go-tab" data-tab="account" class="sm-lock-banner mt-2" style="display:inline-flex;background:#E9F2EE;color:#2F5D4E;border:1px solid #CFE1D8">
            ${subscriptionStatusText()}
          </button>
        </header>
        <nav class="sm-sticky-nav flex w-full" aria-label="Primary navigation">
          ${navHtml}
        </nav>
        <main id="main-content" class="sm-safe-x pt-4 space-y-4" tabindex="-1">
          ${mainHtml}
        </main>
      </div>
    </div>
  `;
}
function render() {
  ensureTrialStarted();
  document.getElementById("root").innerHTML = renderShell();
  if (UI.tab === "reports" && premiumActive()) initCharts();
}

/* ================= events ================= */
function wireEvents() {
  const root = document.getElementById("root");

  root.addEventListener("input", (e) => {
    const t = e.target;
    if (!t.dataset.draft) return;
    if (t.dataset.draft.includes(".")) {
      const [group, key] = t.dataset.draft.split(".");
      UI[group][key] = t.value;
    } else {
      UI[t.dataset.draft] = t.value;
    }
  });

  root.addEventListener("change", (e) => {
    const t = e.target;
    const a = t.dataset.changeAction;
    if (a === "toggle-enabled") { DATA.enabled = t.checked; persist(); render(); }
    else if (a === "toggle-autosuggest") { DATA.autoSuggest = t.checked; persist(); render(); }
    else if (a === "toggle-paused") { DATA.paused = t.checked; persist(); render(); }
    else if (a === "toggle-manual-approval") { DATA.manualApproval = t.checked; persist(); render(); }
  });

  root.addEventListener("focusout", (e) => {
    const t = e.target;
    const a = t.dataset.blurAction;
    if (a === "set-wallet-balance") {
      const v = parseFloat(t.value);
      DATA.wallets[t.dataset.source] = v >= 0 ? v : 0;
      persist(); render();
    } else if (a === "set-min-wallet-balance") {
      const v = parseFloat(t.value);
      DATA.minWalletBalance = v >= 0 ? v : 0;
      persist(); render();
    } else if (a === "set-daily-limit") {
      const v = parseFloat(t.value);
      DATA.dailyLimit = v >= 3 ? v : 3;
      persist(); render();
    } else if (a === "set-monthly-limit") {
      const v = parseFloat(t.value);
      DATA.monthlyLimit = v >= 3 ? v : 3;
      persist(); render();
    }
  });

  root.addEventListener("click", async (e) => {
    const btn = e.target.closest("[data-action]");
    if (!btn) return;
    const action = btn.dataset.action;

    switch (action) {
      case "go-tab":
        UI.tab = btn.dataset.tab;
        if (UI.tab === "home") detectGcashSpareMoney();
        if (UI.tab === "account" || UI.tab === "settings") await syncGcashStatus();
        break;

      case "check-spare-money": checkSpareMoney(btn.dataset.source); break;
      case "change-amount":
        if (UI.suggestion) { UI.suggestion.customizing = true; UI.customAmount = String(UI.suggestion.amount); }
        break;
      case "cancel-custom":
        if (UI.suggestion) UI.suggestion.customizing = false;
        break;
      case "apply-custom-amount": applyCustomSpareAmount(); break;
      case "confirm-collection": await confirmSpareCollection(); break;
      case "not-now": dismissSpareCollection(true); break;
      case "dismiss-info": dismissSpareCollection(false); break;
      case "toggle-history": UI.showFullHistory = !UI.showFullHistory; break;
      case "add-manual-money": {
        const amt = parseFloat(UI.manualAmount);
        if (amt && amt > 0) {
          addManualContribution(DATA.activePriorityId || null, amt);
          UI.manualAmount = "";
        }
        break;
      }
      case "ask-home-withdraw":
        if (generalSavingsAvailable() > 0) UI.homeWithdrawConfirm = true;
        break;
      case "cancel-home-withdraw":
        UI.homeWithdrawConfirm = false;
        break;
      case "confirm-home-withdraw": {
        const available = generalSavingsAvailable();
        if (available > 0) {
          const withdrawn = withdrawGeneralSavings(available);
          UI.homeWithdrawSuccess = withdrawn;
        }
        UI.homeWithdrawConfirm = false;
        break;
      }
      case "dismiss-home-withdraw-success":
        UI.homeWithdrawSuccess = null;
        break;

      case "submit-schedule": {
        const sd = UI.scheduleDraft;
        const amt = parseFloat(sd.amount);
        if (sd.purpose.trim() && amt && amt > 0 && sd.date) {
          addPriority({ name: sd.purpose.trim(), target: amt, withdrawDate: sd.date });
          UI.scheduleSuccess = { amount: amt, date: sd.date };
          UI.scheduleDraft = { purpose: "", amount: "", date: "" };
        }
        break;
      }
      case "dismiss-schedule-success":
        UI.scheduleSuccess = null;
        break;

      case "activate-premium":
        activatePaidPlan();
        break;

      case "google-sign-in":
        requestGoogleSignIn();
        break;
      case "google-sign-out":
        if (DATA.account.gcashConnected) { try { await disconnectGcash(); } catch (e) {} }
        DATA.account.google = null;
        UI.accountDraft = { consentFor: null };
        UI.googleAuthError = null;
        persist();
        break;
      case "request-connect":
        if (btn.dataset.source === "gcash") await startGcashLink();
        break;
      case "cancel-gcash-link":
        cancelGcashLink();
        break;
      case "disconnect-wallet":
        if (btn.dataset.source === "gcash") await disconnectGcash();
        break;

      case "toggle-priority-form":
        UI.prioritiesDraft.showForm = !UI.prioritiesDraft.showForm;
        break;
      case "submit-priority": {
        const pd = UI.prioritiesDraft;
        const t = parseFloat(pd.target);
        if (pd.name.trim() && t && t > 0 && pd.withdrawDate) {
          addPriority({ name: pd.name.trim(), target: t, withdrawDate: pd.withdrawDate });
          UI.prioritiesDraft = { showForm: false, name: "", target: "", withdrawDate: "", addingTo: null, addAmount: "", confirmDelete: null, confirmWithdraw: null };
        }
        break;
      }
      case "set-active-priority":
        DATA.activePriorityId = btn.dataset.id;
        persist();
        break;
      case "set-adding-to":
        UI.prioritiesDraft.addingTo = btn.dataset.id;
        UI.prioritiesDraft.addAmount = "";
        break;
      case "cancel-adding-to":
        UI.prioritiesDraft.addingTo = null;
        break;
      case "submit-priority-add": {
        const amt = parseFloat(UI.prioritiesDraft.addAmount);
        if (amt && amt > 0) {
          addManualContribution(btn.dataset.id, amt);
          UI.prioritiesDraft.addAmount = "";
          UI.prioritiesDraft.addingTo = null;
        }
        break;
      }
      case "ask-delete-priority":
        UI.prioritiesDraft.confirmDelete = btn.dataset.id;
        break;
      case "cancel-delete-priority":
        UI.prioritiesDraft.confirmDelete = null;
        break;
      case "confirm-delete-priority":
        deletePriority(btn.dataset.id);
        UI.prioritiesDraft.confirmDelete = null;
        break;
      case "ask-withdraw":
        UI.prioritiesDraft.confirmWithdraw = btn.dataset.id;
        break;
      case "cancel-withdraw":
        UI.prioritiesDraft.confirmWithdraw = null;
        break;
      case "confirm-withdraw":
        withdrawPriority(btn.dataset.id);
        UI.prioritiesDraft.confirmWithdraw = null;
        break;

      case "ask-reset": UI.confirmReset = true; break;
      case "cancel-reset": UI.confirmReset = false; break;
      case "reset-all":
        stopGcashPolling();
        if (DATA.account && DATA.account.gcashConnected) { try { await disconnectGcash(); } catch (e) {} }
        DATA = defaultData();
        UI = { tab: UI.tab, suggestion: null, showFullHistory: false, customAmount: "", manualAmount: "", confirmReset: false, homeWithdrawConfirm: false, homeWithdrawSuccess: null, scheduleDraft: { purpose: "", amount: "", date: "" }, scheduleSuccess: null, prioritiesDraft: { showForm: false, name: "", target: "", withdrawDate: "", addingTo: null, addAmount: "", confirmDelete: null, confirmWithdraw: null }, accountDraft: { consentFor: null }, lastObservedGcashBalance: null, gcashLink: { status: "idle", authUrl: null, error: null }, gcashCollectError: null, collectionInFlight: false };
        persist();
        break;
    }
    render();
  });
}

/* ================= init ================= */
function init() {
  loadData();
  ensureTrialStarted();
  render();
  wireEvents();
  detectGcashSpareMoney();
  syncGcashStatus().then(render);
  setInterval(() => {
    if (UI.tab === "home") {
      detectGcashSpareMoney();
      if (UI.suggestion) render();
    }
  }, 3000);
}

init();
// Step 7 mobile/PWA polish enabled
</script>
</body>
</html>
